name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
  automerge:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/update/craft-apps'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr merge update/craft-apps --repo "$GITHUB_REPOSITORY"
          --squash --delete-branch --match-head-commit "$GITHUB_SHA"
